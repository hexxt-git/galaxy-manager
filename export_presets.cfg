[preset.0]

name="Web"
platform="Web"
runnable=true
export_filter="all_resources"
include_filter=""
exclude_filter="art-src/*,tests/*,docs/*,design.md,README.md"
export_path="build/web/index.html"

[preset.0.options]

variant/extensions_support=false
variant/thread_support=false
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=false
html/canvas_resize_policy=2
html/head_include="<style>#status-progress{appearance:none;-webkit-appearance:none;height:14px;width:min(50%,360px);border:3px solid #0d0d12;border-radius:10px;background:#dfe4ea;overflow:hidden}#status-progress::-webkit-progress-bar{background:#dfe4ea}#status-progress::-webkit-progress-value{background:#f2c230}#status-progress::-moz-progress-bar{background:#f2c230}</style>"
html/focus_canvas_on_start=true
progressive_web_app/enabled=false
