const rr = (a, b) => a + rand() * (b - a);

// --- pen ---------------------------------------------------------------

// Chaikin corner-cutting: turns a rough polygon into the soft outline a round paint brush leaves.
function smooth(pts, closed = true, iter = 3) {
  let p = pts;
  for (let it = 0; it < iter; it++) {
    const out = [];
    const n = p.length;
    const last = closed ? n : n - 1;
    if (!closed) out.push(p[0]);
    for (let i = 0; i < last; i++) {
      const a = p[i], b = p[(i + 1) % n];
      out.push([a[0] * 0.75 + b[0] * 0.25, a[1] * 0.75 + b[1] * 0.25]);
      out.push([a[0] * 0.25 + b[0] * 0.75, a[1] * 0.25 + b[1] * 0.75]);
    }
    if (!closed) out.push(p[n - 1]);
    p = out;
  }
  return p;
}

function wobble(pts, amp = 1, step = 4, closed = false) {
  amp *= WOBBLE;
  const src = closed ? [...pts, pts[0]] : pts;
  const out = [];
  const p1 = rr(0, 6.28), p2 = rr(0, 6.28), f1 = rr(0.025, 0.04), f2 = rr(0.07, 0.1);
  let d = 0;
  for (let i = 0; i < src.length - 1; i++) {
    const [ax, ay] = src[i], [bx, by] = src[i + 1];
    const len = Math.hypot(bx - ax, by - ay) || 1;
    const nx = -(by - ay) / len, ny = (bx - ax) / len;
    const n = Math.max(1, Math.round(len / step));
    for (let k = 0; k < n; k++) {
      const t = k / n;
      const dd = d + len * t;
      const o = amp * (Math.sin(dd * f1 + p1) * 0.75 + Math.sin(dd * f2 + p2) * 0.25);
      out.push([ax + (bx - ax) * t + nx * o, ay + (by - ay) * t + ny * o]);
    }
    d += len;
  }
  if (!closed) out.push(src[src.length - 1]);
  return out;
}

function path(pts, closed) {
  ctx.beginPath();
  ctx.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
  if (closed) ctx.closePath();
}

function stroke(w, color = INK) {
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.lineWidth = w;
  ctx.strokeStyle = color;
  ctx.stroke();
}

function pen(pts, w, color = INK, amp = 1) {
  path(wobble(pts, amp, 4, false), false);
  stroke(w, color);
}

function shape(pts, fill, w, amp = 1) {
  const p = wobble(pts, amp, 4, true);
  path(p, true);
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (w) stroke(w);
  return p;
}

function blob(pts, fill) {
  path(pts, true);
  ctx.fillStyle = fill;
  ctx.fill();
}

function clipTo(pts, fn) {
  ctx.save();
  path(pts, true);
  ctx.clip();
  fn();
  ctx.restore();
}

const WALK = ['walk1', 'walk2', 'walk3', 'walk4'];
const OUTLINE = 5;
const AMP = 0.3;

// lineScale multiplies stroke widths, so the figure can shrink without thinning its outline
function character(cx, by, colour, s = 1, flip = false, frame = 'idle', lineScale = 1) {
  const [main, dark] = PAL[colour];
  const F = FRAMES[frame];
  const W = (F.outline || OUTLINE) * lineScale;
  ctx.save();
  ctx.translate(cx, by);
  ctx.scale(s * (flip ? -1 : 1), s);

  for (const p of F.parts) {
    if (p.seed) seed = p.seed;
    const [base, other] = p.base === 'main' ? [main, dark] : [dark, main];
    const sp = shape(p.path, base, W, AMP);
    if (p.cut) clipTo(sp, () => blob(p.cut, other));
    path(sp, true); stroke(W);
  }
  for (const l of F.lines) pen(l.pts, l.w * lineScale, INK, AMP);

  if (F.visor.seed) seed = F.visor.seed;
  const vp = shape(F.visor.path, '#95cadc', W, AMP);
  clipTo(vp, () => {
    blob(F.visor.shadow, '#4f7d93');
    blob(F.visor.highlight, '#ffffff');
  });
  path(vp, true); stroke(W);

  ctx.restore();
}

// --- layout --------------------------------------------------------------

function label(t, x, y) {
  ctx.font = 'bold 15px sans-serif';
  ctx.fillStyle = '#123';
  ctx.textAlign = 'center';
  ctx.fillText(t, x, y);
}

ctx.fillStyle = '#9fd6e6';
ctx.fillRect(0, 0, W, H);

label('reference (sprite sheet, 4x)', 230, 30);
label('mine (4x)', 620, 30);
label('overlay: mine (magenta) on reference', 980, 30);

character(620, 425, 'red', 3.72, true);

label('palette at game size (1x)', 600, 560);
Object.keys(PAL).forEach((c, i) => character(105 + i * 110, 700, c, 1, i % 2 === 1));

const img = new Image();
img.onload = () => {
  ctx.imageSmoothingEnabled = false;
  // standing red character from the top-right block of the sheet
  ctx.drawImage(img, 598, 0, 86, 104, 60, 50, 344, 416);
  ctx.globalAlpha = 0.55;
  ctx.drawImage(img, 598, 0, 86, 104, 840, 50, 344, 416);
  ctx.globalAlpha = 1;
  ctx.save();
  ctx.translate(980, 425);
  ctx.scale(-3.72, 3.72);
  const F = FRAMES.idle;
  for (const p of [...F.parts.map(q => q.path), F.visor.path]) { path(p, true); stroke(1, '#ff00c8'); }
  for (const l of F.lines) { path(l.pts, false); stroke(1, '#ff00c8'); }
  ctx.restore();
};
img.src = 'reference/sprite_sheet.png';
